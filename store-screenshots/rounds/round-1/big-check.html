<!doctype html>
<html style="--n:1"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root{--ink:#143a63;--accent:#17b25b;--on-accent:#06321a}
  .slide{background:
      radial-gradient(1300px 1300px at 50% 18%, rgba(255,255,255,.55), transparent 60%),
      linear-gradient(175deg, #c3f1d6 0%, #d9f6e4 55%, #eefbf2 100%)}
  .badge{position:absolute;left:96px;top:116px;width:88px;height:88px;border-radius:26px;overflow:hidden;
    box-shadow:0 18px 30px -12px rgba(20,58,99,.35);background:#fff;z-index:5}
  .badge img{width:100%;height:100%;display:block}
  .bigcheck{position:absolute;left:50%;top:1680px;width:1760px;height:1760px;margin-left:-880px;margin-top:-880px;
    transform:rotate(-7deg);opacity:.17;z-index:0}
  .copy{top:260px;z-index:4}
  .h{font:800 158px/.96 "Bricolage Grotesque";font-variation-settings:"opsz" 96;letter-spacing:-.045em;color:var(--ink)}
  .mark{display:inline-block;background:var(--accent);color:#fff;padding:0 .16em .05em;border-radius:.2em;transform:rotate(-2.2deg);margin-left:-.05em}
  .sub{font:500 46px/1.3 Inter;letter-spacing:-.015em;color:color-mix(in srgb,var(--ink) 78%,transparent);margin-top:38px}
  .seal{z-index:5;left:70px;top:2404px;width:320px;height:320px;transform:rotate(-11deg)}
  .seal>b{font:800 50px/.9 "Bricolage Grotesque";letter-spacing:-.03em;color:var(--ink)}
  .phone{left:190px;top:860px;z-index:3}
  .grain{opacity:.05}
</style>
<script src="../../screens/screens.js"></script>
</head><body>

<div class="slide" style="left:0">
  <svg class="bigcheck" viewBox="0 0 200 200">
    <path d="M36 108 L82 154 L166 52" fill="none" stroke="#17b25b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="badge"><img src="../../assets/brand/icon.png" alt=""></div>
  <div class="copy">
    <div class="h">Plan your<br><span class="mark">day.</span></div>
    <div class="sub">Hour by hour, kept simple.</div>
  </div>
  <div class="phone" data-src="iphone-17-2026-10-10-at-13-45-14" data-w="900"></div>
  <div class="seal"><svg data-seal="#ffffff" data-ink="#143a63" data-ring="NO PAYWALL • NO ACCOUNT • "></svg><b>Always<br>free</b></div>
  <div class="grain"></div>
</div>

<script src="shared.js"></script>
</body></html>
